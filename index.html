        <script>
            (function () {
                var btn = document.querySelector('[data-disclosure]');
                var nav = document.getElementById('wa-docs-rail-nav');
                if (!btn || !nav) return;
                btn.addEventListener('click', function () {
                    var hidden = nav.hasAttribute('data-mobile-hidden');
                    if (hidden) {
                        nav.removeAttribute('data-mobile-hidden');
                    } else {
                        nav.setAttribute('data-mobile-hidden', '');
                    }
                    btn.setAttribute('aria-expanded', hidden ? 'true' : 'false');
                    btn.querySelector('.wa-docs-disclosure-icon').textContent = hidden ? '×' : '+';
                });
            })();
